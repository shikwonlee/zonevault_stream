<!-- AngelThump embed for prdt — auto-refreshes on reconnect -->
<div id="at-player-prdt" style="position:relative;aspect-ratio:16/9;background:#000;">
  <video id="at-video-prdt" style="width:100%;height:100%;" controls muted playsinline></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
(function(){
  var CHANNEL = "prdt";
  var video = document.getElementById("at-video-prdt");
  var hls = null, sessionKey = null;

  function regionHost(server){
    var map = { nyc:"nyc3", sfo:"sfo3", ams:"ams3", tor:"tor1", blr:"blr1", syd:"syd1", fra:"fra1", lon:"lon1", sgp:"sgp1" };
    var prefix = (server || "").split("-")[0];
    return map[prefix] || (prefix + "1");
  }

  function deriveManifest(data){
    var user = data.user, ingest = data.ingest;
    if(!user || !ingest || data.type !== "live") return null;
    var segment = btoa(data.createdAt + user.username) + "_" + user.username;
    var host = regionHost(ingest.server);
    return { url: "https://" + host + ".angelthump.com/hls/" + segment + "/index.m3u8", sessionKey: data.createdAt };
  }

  function fetchStream(){
    var endpoint = "https://api.angelthump.com/v2/streams/" + CHANNEL;
    return fetch(endpoint, { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .catch(function(){
        return fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(endpoint), { cache: "no-store" })
          .then(function(r){ if(!r.ok) throw 0; return r.json(); });
      });
  }

  function poll(){
    fetchStream().then(function(data){
      var manifest = deriveManifest(data);
      if(manifest && manifest.sessionKey !== sessionKey){
        sessionKey = manifest.sessionKey;
        if(hls){ hls.destroy(); }
        if(window.Hls && Hls.isSupported()){
          hls = new Hls();
          hls.loadSource(manifest.url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(function(){}); });
        }else if(video.canPlayType("application/vnd.apple.mpegurl")){
          video.src = manifest.url;
          video.play().catch(function(){});
        }
      }
      if(!manifest){ sessionKey = null; }
    }).catch(function(){});
  }

  poll();
  setInterval(poll, 10000);
})();
</script>
