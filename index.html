<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Request Access & Login | Zone Vault</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root {
      --surface-bg: #0a0a0c;
      --surface-1: #141414;
      --surface-2: #1e1e1e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --accent-flat: #e53935; 
      --success: #4CAF50;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--surface-bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 20px; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .auth-box {
      background: var(--surface-1); padding: 32px 24px; border-radius: 16px; width: 100%; max-width: 400px;
      border: 1px solid var(--border-subtle); text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .auth-box img { width: 56px; border-radius: 12px; margin-bottom: 16px; }
  .auth-box h2 { margin: 0 0 8px 0; font-size: 22px; }
  .auth-box p.sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
  .auth-box input {
      width: 100%; padding: 14px; margin-bottom: 12px; background: var(--surface-2); color: var(--text-primary);
      border: 1px solid var(--border-subtle); border-radius: 8px; outline: none; transition: 0.2s; font-size: 14px;
  }
  .auth-box input:focus { border-color: var(--text-secondary); }
  
  /* Button Layout */
  .btn-group { display: flex; gap: 10px; margin-top: 5px; }
  .btn-action { 
      flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; 
      cursor: pointer; transition: 0.2s; font-size: 15px; 
  }
  .btn-login { background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border-subtle); }
  .btn-login:hover { background: var(--border-subtle); }
  .btn-request { background: var(--text-primary); color: #000; }
  .btn-request:hover { opacity: 0.9; }
  .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
  
  #auth-msg { margin-top: 16px; font-size: 13px; font-weight: 500; min-height: 20px; line-height: 1.4;}
</style>
</head>
<body>

<div class="auth-box">
    <img src="https://uploads.onecompiler.io/43ddry4jt/43s3sjvch/Zone%20Vault%20logo.png" alt="Logo">
    <h2>Zone Vault</h2>
    <p class="sub">Log in with an approved username, or request access</p>
    
    <input type="text" id="tg-user" placeholder="Telegram Username (e.g. @carat123)" autocomplete="off">
    <input type="password" id="tg-code" placeholder="Access Code (For new requests only)" autocomplete="off">
    
    <div class="btn-group">
        <button class="btn-action btn-login" onclick="handleLogin()" id="loginBtn">Login</button>
        <button class="btn-action btn-request" onclick="handleRequest()" id="requestBtn">Request Join</button>
    </div>
    
    <p id="auth-msg"></p>
</div>

<script>
// Disable Right-Click (Context Menu)
document.addEventListener('contextmenu', event => event.preventDefault());

const firebaseConfig = {
  apiKey: "AIzaSyAeaQVRzcL9qvGRKpqGyPKolTMltieN3zU",
  authDomain: "notif-bfe68.firebaseapp.com",
  databaseURL: "https://notif-bfe68-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "notif-bfe68",
  storageBucket: "notif-bfe68.firebasestorage.app",
  messagingSenderId: "417377105074",
  appId: "1:417377105074:web:bf27cd8dbbf0cc101005ab"
};
firebase.initializeApp(firebaseConfig);

// Setup Realtime Database
const dbRTDB = firebase.database();

let storedUser = localStorage.getItem("zone_vault_user");
let mContainer = document.getElementById("auth-msg");
let loginBtn = document.getElementById("loginBtn");
let requestBtn = document.getElementById("requestBtn");
let isApproved = false;

// Utility to set UI state quickly
function setUIState(disabled, loginText = "Login", requestText = "Request Join") {
    loginBtn.disabled = disabled;
    requestBtn.disabled = disabled;
    loginBtn.innerText = loginText;
    requestBtn.innerText = requestText;
    if (disabled) {
        document.getElementById("tg-user").disabled = true;
        document.getElementById("tg-code").disabled = true;
    } else {
        document.getElementById("tg-user").disabled = false;
        document.getElementById("tg-code").disabled = false;
    }
}

function showMessage(msg, color) {
    mContainer.innerHTML = msg;
    mContainer.style.color = color;
}

// ==========================================
// 1. FAST LOGIN FUNCTION
// ==========================================
async function handleLogin() {
    const user = document.getElementById("tg-user").value.trim();
    if(!user) {
        showMessage("Please enter your Telegram Username to log in.", "var(--accent-flat)");
        return;
    }

    setUIState(true, "Checking...", "Wait");
    showMessage("", "");

    try {
        const approvedSnapshot = await dbRTDB.ref("approved_users/" + user).once("value");
        
        if (approvedSnapshot.exists()) {
            showMessage("Username recognized!<br>Logging you in...", "var(--success)");
            localStorage.setItem("zone_vault_user", user); 
            setTimeout(() => { window.location.href = "live_event.html"; }, 1000); // Faster redirect
        } else {
            showMessage("Access Denied. Account not found or not yet approved.", "var(--accent-flat)");
            setUIState(false);
        }
    } catch(e) {
        showMessage("Error connecting to server. Please try again.", "var(--accent-flat)");
        setUIState(false);
    }
}

// ==========================================
// 2. REQUEST JOIN FUNCTION
// ==========================================
async function handleRequest() {
    const user = document.getElementById("tg-user").value.trim();
    const code = document.getElementById("tg-code").value.trim();
    
    if(!user || !code) {
        showMessage("Please provide BOTH a Username and an Access Code to request join.", "var(--accent-flat)");
        return;
    }

    setUIState(true, "Wait", "Checking...");
    showMessage("", "");

    try {
        // Fast Check 1: Are they already approved?
        const approvedSnapshot = await dbRTDB.ref("approved_users/" + user).once("value");
        if (approvedSnapshot.exists()) {
            showMessage("This account is already approved! Please use the Login button.", "var(--success)");
            setUIState(false);
            return;
        }

        // Fast Check 2: Are they already pending?
        const pendingSnapshot = await dbRTDB.ref("join_requests/" + user).once("value");
        if (pendingSnapshot.exists()) {
            showMessage("This username is currently pending approval. Please wait.", "var(--accent-flat)");
            setUIState(false);
            return;
        }

        // If neither, submit to Firebase
        setUIState(true, "Wait", "Sending...");
        await dbRTDB.ref("join_requests/" + user).set({
            username: user,
            code: code,
            status: "pending",
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        
        // Save to browser and start live listener
        localStorage.setItem("zone_vault_user", user);
        setUIState(true, "Locked", "Awaiting Verification");
        listenForApproval(user);
        
    } catch(e) {
        showMessage("Error connecting to server. Please try again.", "var(--accent-flat)");
        setUIState(false);
    }
}

// ==========================================
// 3. REAL-TIME LISTENER (For Pending Users)
// ==========================================
function listenForApproval(username) {
    showMessage(`Request is active for ${username}.<br>Please wait for admin approval...`, "var(--text-secondary)");
    
    const approvedRef = dbRTDB.ref("approved_users/" + username);
    const requestRef = dbRTDB.ref("join_requests/" + username);
    
    // Listen for Approval
    approvedRef.on("value", (snapshot) => {
        if (snapshot.exists()) {
            isApproved = true;
            showMessage("Access Approved!<br>Redirecting you to the events...", "var(--success)");
            setTimeout(() => { window.location.href = "live_event.html"; }, 1500);
        } else {
            isApproved = false;
        }
    });

    // Listen for Rejection (Deleted from join_requests)
    requestRef.on("value", (snapshot) => {
        if (!snapshot.exists() && !isApproved) {
            setTimeout(() => {
                if (!isApproved) {
                    approvedRef.off();
                    requestRef.off();
                    resetForm();
                }
            }, 1000);
        }
    });
}

function resetForm() {
    localStorage.removeItem("zone_vault_user"); 
    document.getElementById("tg-user").value = "";
    document.getElementById("tg-code").value = "";
    setUIState(false);
    showMessage("Your previous request was rejected or deleted.<br>You may submit a new request.", "var(--accent-flat)");
}

// Auto-trigger if local storage shows they were waiting
if (storedUser) {
    document.getElementById("tg-user").value = storedUser;
    setUIState(true, "Locked", "Awaiting Verification");
    listenForApproval(storedUser);
}
</script>
</body>
</html>
